<html lang="es">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width,initial-scale1.0">
       <title>Cambiar el color-CSS</title>
       <link rel="stylesheet" href="style.css">
    </head>
         <body>
            <div class="theme-wrapper">
                <input type="radio" name="theme" id="theme-light" checked>
                <input type="radio" name="theme" id="theme-dark" checked>
                <input type="radio" name="theme" id="theme-custom" checked>

                 <div class="card">
                    <div class="theme-switcher">
                         <label for="theme-light" class="label-light">Light</label>
                         <label for="theme-dark" class="label-dark">Dark</label>
                         <label for="theme-custom" class="label-custom">Custom</label>
                    </div> 
                    <div class="card-content">
                        <h2>Hello, world!</h2>
                        <p>Tema simple Cambiar los temas</p>
                        <button class="primary-btn">Primary Button</button>
                    </div>
                </div>
            </div>
         </body>
</html>
